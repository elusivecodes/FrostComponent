<!-- shadow -->

<style>
    form {
        display: flex;
        gap: 0.5em;
    }

    input {
        flex: 1;
        padding: 0.6em;
        border: 1px solid #CCC;
        border-radius: 5px;
        font-size: 1em;
    }

    button {
        padding: 0.6em 1em;
        border: none;
        background-color: #007BFF;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
    }
</style>

<form @submit.prevent="{ this.dispatch('save') }">
    <input type="text" x:bind="text" />
    <button type="submit">Add</button>
</form>
