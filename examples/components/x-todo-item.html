<!-- shadow -->

<style>
    :host {
        display: block;
    }

    li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.65em 0.5em;
        border-bottom: 1px solid #DDD;
    }

    label {
        display: flex;
        align-items: center;
        gap: 0.5em;
        cursor: pointer;
    }

    button {
        border: none;
        background: none;
        color: #666;
        cursor: pointer;
        font-size: 1em;
    }
</style>

<li>
    <label>
        <input type="checkbox" x:bind="completed" @change="{ this.dispatch('toggle') }" />
        <span :style="{ this.state.completed ? 'text-decoration: line-through;' : '' }">{text}</span>
    </label>
    <button @click.prevent="{ this.dispatch('remove') }">x</button>
</li>
