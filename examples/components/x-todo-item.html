<!-- shadow -->

<style>
    :host {
        display: block;
    }

    li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 0.875rem;
        border: 1px solid var(--todo-border, #cbd5e1);
        border-radius: 0.5rem;
        background: #fff;
    }

    label {
        display: flex;
        min-width: 0;
        flex: 1;
        align-items: center;
        gap: 0.75rem;
        cursor: pointer;
    }

    input {
        width: 1.125rem;
        height: 1.125rem;
        flex: 0 0 auto;
        margin: 0;
        accent-color: var(--todo-accent, #2563eb);
    }

    span {
        overflow-wrap: anywhere;
    }

    input:checked + span {
        color: var(--todo-muted, #64748b);
    }

    button {
        width: 2rem;
        height: 2rem;
        flex: 0 0 auto;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--todo-muted, #64748b);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
    }

    button:hover {
        background: #fee2e2;
        color: #b91c1c;
    }

    button:focus-visible {
        outline: 3px solid #fecaca;
        outline-offset: 1px;
    }
</style>

<li>
    <label>
        <input type="checkbox" x:bind="completed" @change="{ this.dispatch('toggle') }" />
        <span :style="{ this.state.completed ? 'text-decoration: line-through;' : '' }">{text}</span>
    </label>
    <button @click.prevent="{ this.dispatch('remove') }">x</button>
</li>
